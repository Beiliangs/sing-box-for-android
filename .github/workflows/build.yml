name: Build Patched SFA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum # 明确告诉它 go.sum 在哪

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Patch AnyTLS Version
        run: |
          # 1. 创建一个临时目录并初始化一个临时 Go 模块
          mkdir temp_patch
          cd temp_patch
          go mod init temp_patch
          
          # 2. 强制下载 anytls 依赖库（使用 master 分支或最新版）
          # 这一步会将源码拉取到当前用户的 Go 缓存目录 (~/go/pkg/mod)
          go mod download github.com/anytls/sing-anytls@master
          
          # 3. 回到根目录并执行全局搜索替换
          cd ..
          echo "Searching and patching version.go in Go cache..."
          find ~/go/pkg/mod/github.com/anytls/ -name "version.go" -exec sed -i 's/"sing-box"/"anytls"/g' {} +
          
          # 4. 验证是否替换成功（可选）
          find ~/go/pkg/mod/github.com/anytls/ -name "version.go" -exec grep "Version =" {} +
          echo "Success: AnyTLS version string has been patched globally."

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfa-patched-apk
          path: app/build/outputs/apk/debug/*.apk
