name: Build Patched SFA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum # 明确告诉它 go.sum 在哪

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch AnyTLS Version
        run: |
          # 1. 尝试在当前目录下寻找 go.mod 以防它在深层目录
          GO_MOD_PATH=$(find . -name "go.mod" | head -n 1)
          if [ -n "$GO_MOD_PATH" ]; then
            cd $(dirname $GO_MOD_PATH)
            go mod download github.com/anytls/sing-anytls@main || true
            cd -
          fi

          # 2. 暴力解除所有可能的 Go 路径和当前目录的只读限制
          echo "Unlocking permissions..."
          chmod -R +w . || true
          [ -d ~/go/pkg/mod ] && chmod -R +w ~/go/pkg/mod || true

          # 3. 全局搜索并修改所有 anytls 相关的 version.go
          # 我们同时搜索工作目录和 Go 缓存目录
          echo "Searching and patching..."
          # 修改工作目录（针对 submodule 或 vendor）
          find . -name "version.go" -path "*anytls*" -exec sed -i 's/"sing-box"/"anytls"/g' {} + || true
          # 修改 Go 缓存（针对 Go Mod 模式）
          find /home/runner/go/pkg/mod -name "version.go" -path "*anytls*" -exec sed -i 's/"sing-box"/"anytls"/g' {} + || true

          # 4. 验证修改结果（加上 || true 防止 grep 失败导致 Action 中断）
          echo "Verifying patch..."
          find . -name "version.go" -path "*anytls*" -exec grep -H "Version =" {} + || true
          find /home/runner/go/pkg/mod -name "version.go" -path "*anytls*" -exec grep -H "Version =" {} + || true
          echo "Patching step finished."

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfa-patched-apk
          path: app/build/outputs/apk/debug/*.apk
