name: Build Patched SFA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: app/go.sum # 明确告诉它 go.sum 在哪

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch AnyTLS Version
        run: |
          # 1. 创建临时模块并下载依赖
          mkdir temp_patch
          cd temp_patch
          go mod init temp_patch
          # 这里直接拉取最新的 main 分支
          go mod download github.com/anytls/sing-anytls@main
          
          # 2. 【关键步骤】给 Go 缓存目录增加写权限
          # Go 默认为了安全将缓存设为只读，必须手动改为可写才能用 sed 修改
          chmod -R +w ~/go/pkg/mod/github.com/anytls/
          
          # 3. 执行替换字符串
          find ~/go/pkg/mod/github.com/anytls/ -name "version.go" -exec sed -i 's/"sing-box"/"anytls"/g' {} +
          
          # 4. 验证修改是否成功
          echo "Checking if patch is applied:"
          find ~/go/pkg/mod/github.com/anytls/ -name "version.go" -exec grep "Version =" {} +
          
          # 5. 清理临时目录
          cd ..
          rm -rf temp_patch
          echo "Success: AnyTLS version string has been patched."

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfa-patched-apk
          path: app/build/outputs/apk/debug/*.apk
