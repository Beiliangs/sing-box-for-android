name: Build Patched SFA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 必须拉取子模块，否则找不到 Libbox 核心
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch AnyTLS Version (Brute Force)
        run: |
          # 给予源码目录读写权限
          chmod -R +w .
          
          # 全局搜索所有 version.go，将 "sing-box" 替换为 "anytls"
          # 这会同时修改 SFA 自身和子模块（third_party/sing-box）中的代码
          find . -name "version.go" -exec sed -i 's/"sing-box"/"anytls"/g' {} +
          
          # 验证修改结果
          echo "Checking patch result:"
          find . -name "version.go" -exec grep -H "Version =" {} + || true

      - name: Build APK
        run: |
          # 设置 NDK 路径（GitHub Runner 默认路径）
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk-bundle
          
          chmod +x gradlew
          # 运行构建任务
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sfa-patched-apk
          path: app/build/outputs/apk/debug/*.apk
