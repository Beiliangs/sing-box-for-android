name: Build Patched SFA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 深度拉取子模块
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Patch AnyTLS Version (The Master Patch)
        run: |
          # 1. 无论源码在哪，先强制下载 AnyTLS 库到全局缓存
          # 这样即使 SFA 编译时去下载，拿到的也是我们改过的缓存
          mkdir -p temp_patch && cd temp_patch
          go mod init temp_patch
          go mod download github.com/anytls/sing-anytls@main
          cd ..

          # 2. 获取 Go 缓存的真实路径并解锁权限
          GOMODCACHE=$(go env GOMODCACHE)
          echo "Go Mod Cache is at: $GOMODCACHE"
          chmod -R +w $GOMODCACHE || true
          chmod -R +w . || true

          # 3. 暴力搜索并修改：同时修改“下载的缓存”和“本地源码”
          # 确保万无一失
          echo "Applying string replacement..."
          find $GOMODCACHE -name "version.go" -exec sed -i 's/"sing-box"/"anytls"/g' {} + || true
          find . -name "version.go" -exec sed -i 's/"sing-box"/"anytls"/g' {} + || true

          # 4. 验证补丁是否成功 (这次如果成功，一定会输出路径)
          echo "Verification Results:"
          find $GOMODCACHE -name "version.go" -exec grep -H "Version =" {} + || true
          find . -name "version.go" -exec grep -H "Version =" {} + || true

      - name: Build Libbox & APK
        run: |
          # 必须安装 gomobile，这是编译 Go 核心的关键
          go install golang.org/x/mobile/cmd/gomobile@latest
          $(go env GOPATH)/bin/gomobile init
          export PATH=$PATH:$(go env GOPATH)/bin
          
          # 设置 NDK 路径
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk-bundle
          
          chmod +x gradlew
          # 尝试清理并编译。先执行 libbox 编译任务（如果存在），再编译 APK
          # 这样可以解决 Unresolved reference 'Libbox'
          ./gradlew clean
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
